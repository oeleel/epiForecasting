# Domain context that used to be hardcoded in
# agent/adapters/flu_forecast.py::get_domain_context ("Epidemic phases" and
# "Performance context" bullets), migrated here on 2026-09-30 so the adapter
# serves it from the bank like every other fact. The wording is kept close to
# the original bullets; the calendar phases are the ones PhaseEvaluator.PHASE_MAP
# scores with (advisor question: calendar vs curve-based phases).
#
# `context.season_week` is the epidemiological week of the year (1..53, week 40
# is early October), inclusive. The peak window (Dec-Jan) wraps the year
# boundary, which a [lo, hi] window cannot express, so that entry carries only
# `context.phase` and lists its months in `payload`.

- id: calendar-phase-onset
  provenance: curated
  category: domain_dynamics
  statement: "Onset phase (Oct-Nov): flu activity begins rising."
  entities: {phase: onset}
  context: {phase: [onset], season_week: [40, 48]}
  payload:
    months: [10, 11]
    source_of_truth: agent/phase_evaluator.py PhaseEvaluator.PHASE_MAP
  evidence:
    source: "migrated from agent/adapters/flu_forecast.py get_domain_context, 2026-09-30"
    n_observations: null
    reward_delta: null
  confidence: high
  llm_gloss: null
  created_at: 2026-09-30

