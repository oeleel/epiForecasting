# Domain context that used to be hardcoded in
# agent/adapters/flu_forecast.py::get_domain_context ("Epidemic phases" and
# "Performance context" bullets), migrated here on 2026-09-30 so the adapter
# serves it from the bank like every other fact. The wording is kept close to
# the original bullets.
#
# The phase entries describe the calendar scheme PhaseEvaluator scores with
# (agent/phase_evaluator.py DEFAULT_PHASE_SCHEME = adiga_2026_10, A. Adiga
# 2026-10-15). They replaced the calendar_v1 entries calendar-phase-onset /
# -peak / -decline on 2026-10-15: those described Oct-Nov / Dec-Jan / Feb-Apr
# windows that evaluation no longer uses, so keeping them would have told the
# LLM the wrong dates for "peak" and "decline". New ids, because the meaning
# changed. October is unassigned by A. Adiga and scored as off_season, an
# assumption awaiting his confirmation.
#
# `context.season_week` is the epidemiological week of the year (1..53, week 40
# is early October), inclusive. Epi weeks do not align with calendar dates, so
# the week windows are approximate; the phase label itself is assigned by date.
# Growth (Nov-Dec) runs to the year end, so its window ends at week 53.

- id: phase-growth-adiga-2026-10
  provenance: curated
  category: domain_dynamics
  statement: "Growth phase (Nov 1 - Dec 31): flu activity rises toward the season peak."
  entities: {phase: growth}
  context: {phase: [growth], season_week: [44, 53]}
  payload:
    phase_scheme: adiga_2026_10
    first_day: "11-01"
    last_day: "12-31"
    source_of_truth: agent/phase_evaluator.py PHASE_SCHEMES["adiga_2026_10"]
  evidence:
    source: "A. Adiga, meeting 2026-10-15"
    n_observations: null
    reward_delta: null
  confidence: high
  llm_gloss: null
  created_at: 2026-10-15

