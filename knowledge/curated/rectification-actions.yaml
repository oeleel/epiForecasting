# The advisor's five rectification actions (Teams follow-up ~2026-09-27, after the
# 09-24 meeting): what to do when the results summarizer reports that a model
# fails at the peak. Meeting record: documentation/meeting-notes/
# 2026-09-24-controlled-experiment-and-curated-guardrails.md, "The experiment".
#
# Every entry carries `payload.recommendation`. `action` is either an adapter
# action the improve loop can take today, or `not_yet_available` when the lever
# does not exist in the adapter yet (then `note` says what is planned). The loop
# is expected to cite the entry it acts on and is still free to explore past it.
#
# Retrieval: `context.phase: [peak, approaching_peak]` so these surface when the
# loop is working the peak (calendar label) or the approaching-peak window
# (curve/hindsight label used by the experiment harness); an unconstrained query
# (no phase) returns them too.

- id: rectify-peak-add-examples-other-seasons
  provenance: curated
  category: model_characteristics
  statement: >
    When a model fails at the peak, add more training examples from the failing phase drawn
    from other seasons, locations, or outbreaks (data is limited, so every extra peak counts).
  entities: {phase: peak}
  context: {phase: [peak, approaching_peak]}
  payload:
    recommendation:
      action: not_yet_available
      params: {}
      note: >
        The cached CDC series starts 2022-02-05, so the only lever is admitting earlier
        seasons; whether the 2020-22 seasons are admissible is an open advisor question.
        Other locations are already pooled in the training set.
    rank: 1
  evidence:
    source: "advisor (A. Adiga), Teams follow-up, ~2026-09-27"
    n_observations: null
    reward_delta: null
  confidence: high
  llm_gloss: null
  created_at: 2026-09-30

- id: rectify-peak-oversample-windows
  provenance: curated
  category: model_characteristics
  statement: >
    If failing-phase samples are limited, oversample the training windows from that phase
    (e.g. the weeks leading into each season's peak) so the fit sees them more often.
  entities: {phase: peak}
  context: {phase: [peak, approaching_peak]}
  payload:
    recommendation:
      action: not_yet_available
      params: {factor: ">1"}
      note: >
        For XGBoost, integer sample weights are equivalent to row duplication except under
        `subsample`; either fold into the loss-weight action or duplicate rows literally to
        keep the two arms distinct. Planned experiment arm, not run yet.
    rank: 2
  evidence:
    source: "advisor (A. Adiga), Teams follow-up, ~2026-09-27"
    n_observations: null
    reward_delta: null
  confidence: high
  llm_gloss: null
  created_at: 2026-09-30

- id: rectify-peak-smote
  provenance: curated
  category: model_characteristics
  statement: >
    SMOTE-style synthetic oversampling of failing-phase rows is a candidate rectification but
    is expected to fail on this data; lowest priority of the five.
  entities: {phase: peak}
  context: {phase: [peak, approaching_peak]}
  payload:
    recommendation:
      action: not_yet_available
      params: {}
      note: Advisor expects it to fail ("likely to fail"); planned arm, run last if at all.
    rank: 3
  evidence:
    source: "advisor (A. Adiga), Teams follow-up, ~2026-09-27"
    n_observations: null
    reward_delta: null
  confidence: low
  llm_gloss: null
  created_at: 2026-09-30

- id: rectify-peak-shorter-window-on-divergence
  provenance: curated
  category: model_characteristics
  statement: >
    If the current season at the forecast week differs from past seasons (no future data is
    available), rely less on seasonal history and fit on a shorter window (6 or 12 weeks
    instead of 52).
  entities: {phase: peak}
  context: {phase: [peak, approaching_peak]}
  payload:
    recommendation:
      action: not_yet_available
      params: {weeks: [6, 12]}
      note: >
        Planned adapter action `set_training_window`; until it lands the experiment harness
        sets `data.train_window_weeks` in the pipeline config directly. The "current season
        diverges from past seasons" trigger is a future derived entry, not yet defined.
    rank: 4
    config_key: data.train_window_weeks
  evidence:
    source: "advisor (A. Adiga), Teams follow-up, ~2026-09-27"
    n_observations: null
    reward_delta: null
  confidence: high
  llm_gloss: null
  created_at: 2026-09-30

- id: rectify-peak-loss-weight-approaching-peak
  provenance: curated
  category: model_characteristics
  statement: >
    Otherwise reweight the loss: weight approaching-peak training rows by lambda > 1 (value to
    be learned) and every other row by 1, so the fit is pulled toward the rise into the peak.
  entities: {phase: peak}
  context: {phase: [peak, approaching_peak]}
  payload:
    recommendation:
      action: reweight_training_samples
      params: {dimension: approaching_peak, weight: ">1, to be learned"}
      note: >
        `value` = weeks before each eligible season's peak that count as approaching-peak
        (guardrail [2, 12], default 6); `weight` = lambda in [1.0, 5.0]. Lambda is the
        peak-rectification experiment's sweep variable.
    rank: 5
    loss: "L = 1/N sum w_i l(yhat_i, y_i); w_i = lambda if approaching-peak else 1"
  evidence:
    source: "advisor (A. Adiga), Teams follow-up, ~2026-09-27"
    n_observations: null
    reward_delta: null
  confidence: high
  llm_gloss: null
  created_at: 2026-09-30
