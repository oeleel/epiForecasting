# Pytest configuration. `pytest` with no arguments runs the real suite only.
#
# scrap/ is a PEP 420 namespace package (no __init__.py does NOT stop
# imports), so it must be excluded here explicitly or a bare `pytest` would
# collect its demoted tests. tests/agent/run_all.py never looks there either.
[pytest]
testpaths = tests/agent
norecursedirs = scrap .venv outputs data .git
