  - id: results
    heading: Held-out result
    label: results
    kind: stack
    blocks:
      - kind: markdown
        body: >-
          **Hypothesis H1.** Peak-phase training rows copied 5 times (`oversample_5`), used for 1-2 week
          forecasts with baseline forecasts for 3-4 weeks, lower peak-phase WIS on 2024-25. The unit is
          the forecast date, because rows from one fit are correlated; each date's value is scaled so
          that the mean over dates equals the pooled peak WIS difference, then averaged over seeds 42,
          43 and 44. Negative is better.
      - kind: table
        columns:
          - Test
          - { label: Dates, format: num }
          - { label: Baseline WIS, format: num }
          - { label: Candidate WIS, format: num }
          - { label: Mean difference, format: num }
          - DM p
          - Bootstrap 95% CI
        rows:
          - ["**Primary:** gated, peak, 2024-25", "11", "359.06", "358.87", "-0.19", "0.99", "[-17.7, +17.5]"]
          - ["Harm guard: gated, all weeks, 2024-25", "35", "117.69", "116.85", "-0.84", "0.82", "[-6.5, +4.4]"]
          - ["Ungated, peak, 2024-25", "11", "359.06", "368.79", "9.73", "0.72", "[-19.2, +39.2]"]
          - ["Ungated, all weeks, 2024-25", "35", "117.69", "121.13", "3.44", "0.51", "[-3.8, +11.9]"]
          - ["Gated, peak, 2025-26 (in-sample, seed 42)", "12", "119.73", "116.60", "-3.13", "0.13", "[-6.1, -0.6]"]
        note: >-
          The bootstrap interval is too narrow with about 12 dates: on 2025-26 it excludes zero while the
          pre-registered test gives p = 0.13.
      - kind: table
        intro: "Why it failed: ungated peak WIS difference by horizon. The gate keeps h1 and h2, so they cancel."
        columns:
          - Season
          - { label: h1, format: delta }
          - { label: h2, format: delta }
          - { label: h3, format: delta }
          - { label: h4, format: delta }
        rows:
          - ["2025-26 (in-sample, seed 42)", "-7.66", "-4.85", "5.50", "26.90"]
          - ["2024-25 seed 42", "-29.0", "23.9", "22.5", "19.2"]
          - ["2024-25 seed 43", "-23.1", "25.8", "18.0", "19.6"]
          - ["2024-25 seed 44", "-24.6", "24.7", "20.7", "19.2"]
      - kind: callout
        tone: warning
        title: Caveats
        body: >-
          [[!Power is low]]: 11 peak forecast dates, so "not confirmed" is not evidence of no effect.
          2024-25 is a harder season: baseline peak WIS is about 3 times the 2025-26 value, and the
          baseline under-predicts the peak by about 440 admissions per row. The base hyperparameters may
          have been tuned with a cutoff inside 2024-25; both arms share them. WIS uses 5 quantiles, so
          absolute values are not comparable with FluSight.

  - id: related
    heading: Related work
    label: positioning
    kind: cards
    columns: 2
    cards:
      - title: TimeSeriesScientist (arXiv 2510.01538)
        badge: no rigor
        tone: warning
        body: >-
          Four LLM agents in one pass pick 3 of 21 models, tune them on validation MAPE and ensemble them.
          [[-No seeds, variance or tests]], point forecasts only, no knowledge bank. On ILI, Prophet has
          about half its MAE. Its missing control (a plain search over its own library) is one our paper
          also needs.
      - title: Hypothesis learning (arXiv 2112.06649)
        badge: template
        tone: info
        body: >-
          Competing hypotheses act as mean functions of a structured Gaussian process; a
          variance-reduction reward picks the next experiment. It ranks hypotheses by reward and
          computes [[!no posterior and no significance]]: a template for our loop, not a ready method.
      - title: ERA (arXiv 2605.16238)
        badge: competitor
        tone: destructive
        body: >-
          LLM tree search over forecasting pipelines, first in the CDC 2025-26 evaluation. Our claim is
          rigor and interpretability with an in-house model, not leaderboard rank.
      - title: POPPER (arXiv 2502.09858)
        badge: design option
        tone: info
        body: >-
          LLM agents falsify hypotheses with sequential e-value tests: a way to control error across many
          hypotheses inside an agent loop.

  - id: open-questions
    heading: Decisions requested
    kind: accordion
    items:
      - title: "What gates the agent's accept decision: the paired test or a posterior?"
        body: >-
          The Diebold-Mariano test exists and is tested. A conjugate Bayesian posterior over competing
          hypotheses can run on saved forecasts without retraining. Recommendation: the test first, the
          posterior next.
      - title: "Test \"emphasis on 1-week only\" on 2023-24?"
        body: >-
          It was formed after seeing 2024-25, so it needs an unused season. 2023-24 is the only one left,
          and its models would train on less than 2 years of history. Recommendation: run it, labelled
          post hoc.
      - title: "Is the forecast date the right unit of analysis?"
        body: >-
          Per date and per season (current), or pool dates across seasons for power. Recommendation: keep
          per-date; pool only hypotheses fixed before either season was seen.
      - title: "Does October count as off-season?"
        body: >-
          The `adiga_2026_10` scheme treats October as off-season by assumption. It changes which rows count
          as growth.

  - id: next
    heading: Next steps
    kind: cards
    columns: 3
    tone: info
    cards:
      - title: Gate the loop
        badge: framework
        body: >-
          Wire the chosen test or posterior into the `improve` accept rule, so the loop accepts only
          significant or probable gains on held-out dates.
      - title: Fixed-hypothesis mode
        badge: framework
        body: >-
          The user states a hypothesis; the agent runs it and reports the result without searching for
          another.
      - title: 1-week-only test
        badge: experiment
        body: >-
          If approved, pre-register and run it on 2023-24.
      - title: Search baseline
        badge: paper
        body: >-
          A plain search over the same action space at equal compute, to show what the LLM adds.
      - title: In-house model
        badge: framework
        body: >-
          Plug in, compare against the bank and run one improvement loop as soon as a model is named.
      - title: Paper
        badge: paper
        body: >-
          The outline now carries the held-out result (section 8.5) and the protocol (section 7); prose
          follows the decisions above.

  - id: reproduce
    heading: Reproduce
    kind: code
    intro: All commands run from the repo root with the project `.venv` active.
    code: |-
      # macOS: xgboost + torch each bundle libomp; avoid the duplicate-runtime segfault
      export KMP_DUPLICATE_LIB_OK=TRUE OMP_NUM_THREADS=1

      # held-out 2024-25 runs, one process per seed (about 23 min each), then merge
      for s in 42 43 44; do
        python scripts/experiments/peak_rectification.py --eval-window holdout_2024_25 --stride-weeks 1 \
          --arms baseline oversample --oversample-factors 5 --seeds $s \
          --pin-data-sha256 c91d9d81b8ab47ee5fe5458123167a3ce9c4171bddca682a89eb573d4b5336cb \
          --out outputs/experiments/holdout-seed$s &
      done; wait
      python scripts/experiments/peak_rectification.py --merge outputs/experiments/holdout-seed4{2,3,4} \
        --out outputs/experiments/peak_rectification_holdout_2024_25

      # the pre-registered primary test (no training)
      python scripts/experiments/significance_test.py \
        --run-dir outputs/experiments/peak_rectification_holdout_2024_25 --candidate oversample_5 --gate horizon

      # the in-sample check on the 2025-26 weekly hindcast
      python scripts/experiments/significance_test.py --candidate oversample_5 --gate horizon

      # this page
      python scripts/reports/build_report.py documentation/reports/2026-11-05
      python scripts/reports/build_report.py --index
