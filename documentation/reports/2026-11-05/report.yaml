# Weekly meeting report, 2026-11-05. Rendered by scripts/reports/build_report.py.
# Section kinds and the markdown subset are documented in ../README.md.
title: "Weekly report - 2026-11-05"
date: "2026-11-05"
summary: >-
  The hypothesis-driven protocol now exists: a held-out 2024-25 season, a pre-registration, and a
  paired per-date significance test. Its first use is negative. Horizon-gated peak emphasis, the best
  in-sample result so far, does not replicate on 2024-25 (peak WIS -0.19, p = 0.99): the 1-week gain
  holds, the 2-week gain reverses.

sections:
  - id: glance
    heading: At a glance
    label: rundown
    kind: table
    columns:
      - Topic
      - Result
      - label: " "
        format: badge
        tones: { done: success, gain: success, problem: destructive, caveat: warning, decide: info }
    rows:
      - ["Asks (10-29)", "framework walkthrough, TSci summary, related work, where the Bayesian loop fits", "done"]
      - ["Held-out split", "2024-25 reserved for confirmation, 35 weekly forecast dates", "done"]
      - ["Significance test", "paired per-date Diebold-Mariano (HLN), block bootstrap as a check", "done"]
      - ["Gated emphasis, 2024-25", "peak WIS 359.06 to 358.87, [[-p = 0.99]], not confirmed", "problem"]
      - ["1-week emphasis", "[[+-23 to -29]] peak WIS in all 3 seeds on 2024-25", "gain"]
      - ["2-week emphasis", "[[-+24 to +26]] in all 3 seeds: reverses the 2025-26 sign", "problem"]
      - ["In-sample check", "2025-26 gated gain -3.13 is not significant either (p = 0.13)", "caveat"]
      - ["Coverage target", "`coverage_95` measures the 90% interval; the loop now aims at 0.90", "done"]
      - ["Decide", "test or posterior as the accept gate? 1-week-only test on 2023-24?", "decide"]

  - id: summary
    heading: Summary
    kind: stack
    blocks:
      - kind: callout
        title: This week in one paragraph
        body: >-
          A. Adiga asked that the framework run a stated hypothesis and report whether it holds,
          instead of searching until something improves. That protocol now exists. The 2024-25 season
          is held out, the hypothesis and the test were committed before any 2024-25 forecast existed,
          and a paired test treats each forecast date as one observation. [[*The first hypothesis
          tested is the best in-sample finding so far, and it fails]]: emphasis on peak-phase training
          rows, used for 1-2 week forecasts only, changes 2024-25 peak WIS by -0.19 (p = 0.99). The
          reason is consistent across seeds: [[+the 1-week gain replicates]], [[-the 2-week gain
          reverses]]. Even in-sample the gain is not significant (p = 0.13). The point estimates the
          project acted on so far are inside the noise of a per-date test.
      - kind: stats
        stats:
          - value: "p = 0.99"
            label: horizon-gated oversample 5x, peak WIS, held-out 2024-25 (11 dates, 3 seeds)
            tone: destructive
          - value: "-25.6"
            label: peak WIS, 1-week forecasts with emphasis on 2024-25 (mean of 3 seeds)
            tone: success
          - value: "+24.8"
            label: peak WIS, 2-week forecasts with emphasis on 2024-25 (mean of 3 seeds)
            tone: destructive
          - value: "p = 0.13"
            label: the same gate in-sample on 2025-26, where it was designed
            tone: warning

  - id: how-it-works
    heading: How the repo works
    label: walkthrough
    kind: tabs
    intro: >-
      The framework in one page: what connects to what, the commands for every step, and a real run
      made on 2026-11-05. The full reference is
      [PROJECT_OVERVIEW.md](https://github.com/oeleel/epiForecasting/blob/main/documentation/PROJECT_OVERVIEW.md).
    tabs:
      - id: map
        label: Map
        blocks:
          - kind: markdown
            body: >-
              Four steps, numbered in the boxes. **1** picks a model family, **2** is the agent loop that
              refines it, **3** runs controlled experiments outside the agent, and **4** tests whether an
              experiment's gain is real. The knowledge bank links them: experiments write facts into it,
              and the agent reads those facts before every proposal.
          - kind: widget
            name: architectureDiagram
            data: data/repo_map.json
      - id: steps
        label: Steps
        blocks:
          - kind: table
            columns:
              - Step
              - What it does
              - Command
              - Time
            rows:
              - - "**0. Set up**"
                - "Python environment, the local LLM (Qwen 3 8B on Ollama), and a check that all tests pass."
                - "`uv venv --python 3.12 .venv` then `ollama pull qwen3:8b` then `python -m pytest tests/agent/ -q`"
                - "once"
              - - "**Check the data**"
                - "Missing weeks, nulls, spikes and zero reporting in the CDC data before training."
                - "`python -m agent check-data --cutoff-date 2025-12-06 --dry-run`"
                - "seconds"
              - - "**1. Pick a model**"
                - "Fits every family from rolling cutoffs on 2025-26 and ranks them by WIS (overall or one phase)."
                - "`python -m agent select-model --stride-weeks 4 --exclude-locations US --metric wis --phase peak`"
                - "minutes"
              - - "**2. Refine it**"
                - "The agent loop: diagnose, propose one action, retrain, keep or revert. Asks before each action unless `--auto-apply`."
                - "`python -m agent improve --cutoff-date 2025-12-06 --max-iterations 2 --auto-apply`"
                - "about 7 min"
              - - "**Inspect a run**"
                - "Every iteration with its action and metrics; the end-of-run report."
                - "`python -m agent history` then `python -m agent status <run_id>` then `python -m agent report <run_id>`"
                - "seconds"
              - - "**3. Run an experiment**"
                - "Baseline against a fixed change, over many cutoffs and seeds, on the held-out season."
                - "`python scripts/experiments/peak_rectification.py --eval-window holdout_2024_25 --stride-weeks 1 --arms baseline oversample --oversample-factors 5 --seeds 42 --out outputs/experiments/holdout-seed42`"
                - "about 23 min per seed"
              - - "**4. Test it**"
                - "Paired per-date test of the change against the baseline. No training."
                - "`python scripts/experiments/significance_test.py --run-dir outputs/experiments/peak_rectification_holdout_2024_25 --candidate oversample_5 --gate horizon`"
                - "seconds"
              - - "**Record it**"
                - "Writes the experiment into the knowledge bank, so later agent runs see it."
                - "`python -m agent knowledge import-experiment --log <run dir>/log.jsonl`"
                - "seconds"
            note: >-
              On macOS, set `export KMP_DUPLICATE_LIB_OK=TRUE OMP_NUM_THREADS=1` first. Every command runs
              from the repo root with the project `.venv` active.
      - id: example
        label: Example run
        blocks:
          - kind: markdown
            body: >-
              A real `improve` run on 2026-11-05 (run `20261105-191315-3fde`, Qwen 3 8B, 6 min 41 s, 2
              iterations). Step through it: what Agent 1 diagnosed, what was retrieved from the bank, what
              Agent 2 proposed and cited, and the WIS after retraining.
          - kind: stats
            stats:
              - value: "192.5"
                label: baseline WIS at cutoff 2025-12-06 (4 target weeks, 208 rows)
              - value: "170.1"
                label: "iteration 1: approaching-peak weight 3.0, kept"
                tone: success
              - value: "163.6"
                label: "iteration 2: approaching-peak weight 5.0, kept"
                tone: success
              - value: "+3.99"
                label: the same kind of change in round 2 (9 cutoffs, 3 seeds); worse in every seed
                tone: destructive
          - kind: widget
            name: runStepper
            data: data/live_run.json
            options:
              outcomeNote: ""
          - kind: callout
            tone: warning
            title: How to read this run
            body: >-
              [[+The mechanics and guardrails work]]: each action was validated before it was applied, and
              an invented citation ("iter 1") was dropped. [[-The 15% gain is not evidence]]: `improve`
              scores one cutoff and one seed, and 2025-12-06 is in the surge, where peak emphasis is known
              to help. Across 9 cutoffs and 3 seeds, round 2 found this kind of change worse on peak WIS.
              [[!The agent saw that result and still proposed it]]: all four round 2 entries for this action
              were in its retrieved facts. In iteration 1 it cited two older entries about calendar-phase weights, a
              different action from the one it chose. This is the case for gating the loop's accept rule with the
              significance test.

