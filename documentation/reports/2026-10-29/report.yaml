  - id: results
    heading: Results in brief
    kind: stack
    blocks:
      - kind: markdown
        body: |-
          XGBoost, 2025-26 season, 35 weekly forecast dates, seed 42, US excluded from scoring.

          - **Surge.** Every configuration forecasts too low: for forecasts made Nov 29 - Dec 20 the
            observation is [[-above baseline's 90% band in 26% of rows]] and below it in none. Peak
            emphasis [[+gets closer]] (WIS -10 to -35 on those dates).
          - **The turn.** The 1-week forecast usually turns down, often too far. The failure is a V at
            3-4 weeks: the median climbs again while the data keeps falling. Baseline does it in 14%
            of forecasts made right after a falling week, [[-peak emphasis in 26-35%]]. This is the
            source of the 1-2 week gain and 3-4 week loss reported last time.
          - **Each state's own turn, not the calendar.** Texas peaked on Dec 27, so its bad dates are
            Dec 20 - Jan 3, and on Jan 10 peak emphasis is better there; the northeast and Ohio turned
            later.
          - **After the peak, large states.** In California, Florida, Texas and Pennsylvania every
            configuration forecast a steep fall while the curve held or rose again (Florida, Jan 24:
            median 684 against 1,606 observed, then a second peak of 2,515). [[-No tested
            configuration fixes this.]]
          - **Not all large-state gains are skill.** California's gain comes largely from its real
            second rise in mid-January; in Texas and Florida part of it comes from late January, when
            every configuration was too low and a higher forecast was less wrong.
          - **Intervals.** 90% coverage over Nov 29 - Feb 7 is 0.43-0.82 per state, and the misses
            are one-sided: above the band in the surge, below it after the turn.
          - **Direction.** Baseline's median points the right way in 72.5% of rows (always saying
            "flat" would get 39.3%) but [[-only 53.8% in the peak phase]]. It says "up" when the
            curve fell in 17% of peak rows; peak emphasis 19-23%, the 52-week window 33%.
          - **The 52-week window** flat-lines during the surge and crashes after the turn; not usable at the
            peak.

          [[*Confining peak emphasis to the 1- and 2-week models keeps most of the surge gain without
          the V.]]
      - kind: table
        intro: >-
          Combining baseline and peak emphasis without retraining: change in WIS against baseline
          (negative is better) and locations that improve overall. "Horizon" uses emphasis for 1-2
          weeks; "calendar" uses it for forecasts made in the growth phase; "curve" uses it while the
          state's curve is still rising.
        columns:
          - Rule
          - { label: Overall WIS, format: delta }
          - { label: Peak WIS, format: delta }
          - { label: Locations better, format: num }
        rows:
          - ["peak oversample 5x, all horizons", "0.99", "4.97", "14"]
          - ["peak oversample 5x, horizon", "-1.18", "-3.13", "40"]
          - ["peak oversample 5x, calendar", "-2.01", "-3.43", "41"]
          - ["peak oversample 5x, curve", "-0.55", "0.77", "24"]
          - ["peak oversample 5x, horizon + curve", "-1.13", "-2.78", "47"]
          - ["peak weight 3x, horizon", "-0.92", "-2.24", "40"]
          - ["peak weight 3x, horizon + curve", "-0.97", "-2.46", "47"]
        note: "Full results and the sensitivity check: `documentation/experiments/weekly_hindcast/gated_emphasis.md`."
      - kind: callout
        tone: warning
        title: Caveats
        body: >-
          [[!Every rule above was designed after looking at this season]], so the gains are in-sample
          and small (about 2-3% of peak WIS) on one seed. The calendar rule wins only because Dec 31
          fell at this season's turn; the curve rule alone changes sign across reasonable thresholds.
          The horizon rule, alone or with the curve rule, stays a gain in every setting tried. A
          held-out season is needed before adopting any of them.

  - id: open-questions
    heading: Open questions
    kind: accordion
    items:
      - title: Switch to FluSight's 23 quantiles?
        body: >-
          The model emits 5 quantiles, so the plots show a 90% band rather than 95%, and WIS is not on
          the FluSight scale (differences between configurations are still valid). Switching means
          retraining round 2 and the weekly run, about 9 hours of compute, and changes every WIS
          number, so it is best decided before the paper's results are written.
      - title: Test the horizon rule on a held-out season?
        body: >-
          Proposal: fix the horizon rule as the primary hypothesis and horizon + curve as secondary,
          then score them on 2024-25 with 3 seeds (about 2.5 hours). This is the test that would make
          the result reportable.
      - title: Why do the largest states collapse after their peak?
        body: >-
          A hypothesis, not tested: a milder form of the scale ceiling that breaks the US forecast
          (the largest training value is 4,729, Texas). Counting training targets above 1,500 and
          looking at feature attributions for those forecasts would test it.
      - title: Is the US forecast worth fixing?
        body: >-
          The model trains on state rows and cannot reach national counts (about 21,000 at the peak);
          its 1-week US forecast collapses to the 30% floor with all quantiles equal. Options: model
          the US separately, or aggregate state forecasts.
      - title: How should "flat" be defined for direction?
        body: >-
          Currently a change under 10% of the last value or 10 admissions, whichever is larger. If the
          lab uses FluSight's rate-trend categories, the metric should follow them.
      - title: Still open from earlier
        body: >-
          October as off-season or growth; which in-house model to onboard first and who can grant
          code access.

  - id: next
    heading: Next steps
    kind: cards
    columns: 3
    tone: info
    cards:
      - title: Held-out test
        badge: experiment
        body: >-
          Score the pre-registered horizon rule on 2024-25 with 3 seeds, pending agreement.
      - title: Quantile set
        badge: decision
        body: >-
          If 23 quantiles are adopted, retrain round 2 and the weekly run before any paper numbers
          are fixed.
      - title: Large-state collapse
        badge: investigation
        body: >-
          Test the scale-ceiling hypothesis on the training data and the 1-week model.
      - title: Paper outline
        badge: paper
        body: >-
          Turn the outline into prose once A. Adiga's comments and the Bayesian-framework draft are in.
      - title: In-house model
        badge: framework
        body: >-
          Plug in, compare against the bank and run one improvement loop as soon as a model is named.
      - title: Calendar
        badge: planning
        body: >-
          Early November is partly available, early December is exams, winter break is for writing
          and experiments; the paper deadline is the first or second week of January.

  - id: reproduce
    heading: Reproduce
    kind: code
    intro: All commands run from the repo root with the project `.venv` active.
    code: |-
      # macOS: xgboost + torch each bundle libomp; avoid the duplicate-runtime segfault
      export KMP_DUPLICATE_LIB_OK=TRUE OMP_NUM_THREADS=1

      # weekly hindcast on round 2's data snapshot (about 2.5 h)
      python scripts/experiments/peak_rectification.py --stride-weeks 1 --seeds 42 \
        --pin-data-sha256 c91d9d81b8ab47ee5fe5458123167a3ce9c4171bddca682a89eb573d4b5336cb \
        --out outputs/experiments/peak_rectification_weekly

      # tracked tables (checked against the run log), the plot, the rules
      python scripts/experiments/export_hindcast_tables.py
      python scripts/plot_forecasts.py --location Pennsylvania --date 2026-01-10
      python scripts/experiments/gated_emphasis.py

      # this page
      python scripts/reports/build_report.py documentation/reports/2026-10-29
      python scripts/reports/build_report.py --index
