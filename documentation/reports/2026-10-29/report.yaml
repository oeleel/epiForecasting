# Weekly meeting report, 2026-10-29. Rendered by scripts/reports/build_report.py.
# Section kinds and the markdown subset are documented in ../README.md.
title: "Weekly report - 2026-10-29"
date: "2026-10-29"
summary: >-
  Every peak-rectification configuration now has a forecast from every week of the 2025-26
  season, with a plot function and an interactive viewer for any location and date. Visual
  inspection shows where the horizon trade-off comes from: peak emphasis helps while a state is
  still rising and draws a rebound at 3-4 weeks after its peak. Using emphasis for 1-2 weeks only
  turns it into a small gain (in-sample).

sections:
  - id: summary
    heading: Summary
    kind: stack
    blocks:
      - kind: callout
        title: This week in one paragraph
        body: >-
          A. Adiga asked for visual inspection, a per-location breakdown, a temporal summary, and a
          viewer for any location and date. All four are done. Every configuration was re-run from
          all 35 weeks of the test season, so any date can be plotted, and the forecasts are in the
          repository as readable tables. [[*The plots show what the pooled score hid: peak emphasis
          helps during the surge and draws a V after the turn]], with the 3- and 4-week median
          climbing again while the data falls. Baseline does this too, emphasis about twice as
          often. Because each horizon has its own model, emphasis can be confined to 1-2 weeks; that
          [[+turns the best emphasis arm from a loss into a gain in 40 of 52 locations]], but it was
          chosen on this season. Inspection also found a problem no configuration fixes:
          [[-after their peak, the largest states are forecast to collapse when they did not]].
      - kind: stats
        stats:
          - value: "35 x 13"
            label: weekly forecast dates x configurations, all locations
          - value: "2x"
            label: how often peak emphasis draws a V after the turn, vs baseline (26-35% vs 14%)
            tone: destructive
          - value: "-3.1"
            label: peak WIS, oversample 5x on 1-2 weeks only (in-sample)
            tone: success
          - value: "0.65 vs 0.83"
            label: 1-week median vs observed, as a share of the last value, states above 1,500
            tone: destructive

  - id: asked
    heading: What was asked
    kind: cards
    columns: 3
    tone: info
    cards:
      - title: A plot function for visual inspection
        badge: 2026-10-21 sync
        body: >-
          Given a location and a date, plot about six weeks of observed data and the 1-4 week
          forecast with the median, the 50% and the 95% intervals, the way the lab inspects
          forecasts before submitting.
      - title: Inspect the forecasts, not only the WIS
        badge: 2026-10-21 sync
        body: >-
          Check that the forecast points the right way when the curve rises or falls, and that the
          intervals are sensible. Why does peak emphasis help at 1-2 weeks and hurt at 3-4?
      - title: Break results out by location
        badge: 2026-10-21 sync
        body: >-
          Show which states gain from a configuration and which do not.
      - title: A temporal summary
        badge: 2026-10-21 sync
        body: >-
          A short account of when the model did well across the season, week by week.
      - title: A viewer with a drop-down
        badge: 2026-10-21 sync
        body: >-
          Pick a location and a date on the test season and see the forecast plot.
      - title: Forecasts in the repository
        badge: 2026-10-21 sync
        body: >-
          Commit the forecast files so they can be plotted with the lab's own scripts.

