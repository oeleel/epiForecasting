  - id: results
    heading: Results in brief
    kind: stack
    blocks:
      - kind: markdown
        body: |-
          Baseline peak WIS **121.01**, bias **-58.8**, coverage **0.855**.

          - **Loss weight on approaching-peak rows.** Peak WIS 123.5-123.9 at every lambda (about +2.5,
            [[-no improvement]]). [[+Bias moves -35.7 / -17.9 / -6.4 / +7.9]] for lambda 1.5 / 2 / 3 / 5.
            [[!Coverage falls to 0.769 at lambda 5]].
          - **Calendar label instead of the curve label.** Matches at matched bias: lambda 3 gives 122.66
            with bias -6.2.
          - **Training window 12 / 26 / 52 weeks.** Peak WIS 238.26 / 240.24 / 197.99,
            [[-worse at every phase]].

          **Interpretation.** [[*The weight fixes the level, not the score]]: the median moves up but the
          intervals do not widen with it, so WIS does not improve and coverage drops.
          [[*Short windows hurt every phase]]: the short-window rule is a per-series statistical-model
          rule and does not transfer to pooled XGBoost, which is the per-model-class point behind the new
          intake stub. [[+Five baselines are identical]], and the harness lands within 1.4 WIS of the
          09-02 selection run.
      - kind: callout
        tone: warning
        title: Caveats
        body: >-
          One split and one seed; calendar phases for scoring; K = 6 assumed; the weight acts
          on `sample_weight` only.
      - kind: table
        intro: >-
          Colour compares each row with the highlighted baseline: [[+green]] is better (lower WIS,
          bias nearer zero, higher coverage), [[-red]] is worse; the triangle is the direction of the
          number.
        columns:
          - Configuration
          - { label: Peak WIS, format: delta, baseline: 0 }
          - { label: Peak bias, format: delta, baseline: 0, better: zero }
          - { label: Peak coverage 95, format: delta, baseline: 0, better: higher }
          - { label: Overall WIS, format: delta, baseline: 0 }
        rows:
          - ["baseline", "121.01", "-58.8", "0.855", "50.05"]
          - ["lambda 1.5 (approaching-peak label)", "123.74", "-35.7", "0.835", "50.92"]
          - ["lambda 2", "123.54", "-17.9", "0.821", "50.64"]
          - ["lambda 3", "123.71", "-6.4", "0.808", "50.40"]
          - ["lambda 5", "123.87", "+7.9", "0.769", "50.53"]
          - ["lambda 2 (calendar label)", "123.70", "-29.8", "0.827", "50.60"]
          - ["lambda 3 (calendar label)", "122.66", "-6.2", "0.806", "50.21"]
          - ["window 12 weeks", "238.26", "-193.0", "0.746", "96.02"]
          - ["window 26 weeks", "240.24", "-188.2", "0.709", "92.16"]
          - ["window 52 weeks", "197.99", "+67.5", "0.829", "71.85"]
        note: Full per-phase and per-horizon numbers are in the Experiment tab above and in `documentation/experiments/2026-10-peak-rectification-results.md`.

  - id: open-questions
    heading: Open questions
    kind: accordion
    items:
      - title: How should approaching-peak be defined, and what is K?
        body: >-
          The experiment labels the K = 6 weeks before each eligible season's maximum. Is the
          definition right (relative to the max, or to a growth threshold), and should K be
          learned per season rather than fixed?
      - title: Are the 2020-2022 seasons admissible as training examples?
        body: >-
          "Add examples from other seasons" needs a rule for which seasons count. The pandemic
          seasons have unusual shapes; the season-eligibility rule currently only requires 40
          weeks of data.
      - title: What lambda range, and should it vary per season or per location?
        body: >-
          The sweep used 1.5 to 5 with one global weight. A per-season or per-location lambda
          could follow the divergence of the current season instead of a fixed guess.
      - title: "Warm-start versus retrain: a bank category or an experiment arm?"
        body: >-
          Re-fitting from the previous model versus training fresh at each cutoff changes what
          "shorter window" even means. It could be a model_characteristics entry or its own arm.
      - title: Calendar or curve-based phases for scoring?
        body: >-
          Scoring uses calendar phases (Dec-Jan is peak). The curve-based segmentation
          (surge / plateau / decline) exists; switching the reward to it changes which entries
          match and which configuration wins.

