# Weekly meeting report, 2026-10-01. Rendered by scripts/reports/build_report.py.
# Section kinds and the markdown subset are documented in ../README.md.
title: "Weekly report - 2026-10-01"
date: "2026-10-01"
summary: >-
  Knowledge bank v1 is in the loop: 27 entries (18 lab-authored, 9 learned from a
  controlled peak-rectification experiment), cited on every proposal. The loss-weight
  rectification fixes the peak bias but not the peak score; shorter windows are worse
  everywhere.

sections:
  - id: summary
    heading: Summary
    kind: stack
    blocks:
      - kind: callout
        title: This week in one paragraph
        body: >-
          The knowledge bank asked for on 2026-09-24 exists and is wired into the improve
          loop: curated YAML is the source of truth, every proposal sees a **KNOWN FACTS**
          block and must cite what it relied on, and exploration is still allowed but logged.
          The five rectification actions from the 2026-09-27 Teams follow-up are seeded as
          curated entries. A controlled experiment on XGBoost's worst phase (peak) swept the
          loss weight and the training window over 9 cutoffs; its 9 outcomes were imported
          back into the bank as experiential entries. Result: [[*the approaching-peak weight moves
          peak bias from -58.8 to about zero without improving peak WIS]], and [[-short windows hurt
          at every phase]].
      - kind: stats
        stats:
          - value: "27"
            label: bank entries (18 lab-authored, 9 learned from the experiment)
          - value: "10 x 9"
            label: experiment configurations x cutoffs, deterministic
          - value: "7"
            label: constrained actions the loop can take
          - value: "369"
            label: tests passing
            tone: success

  - id: asked
    heading: What was asked
    kind: cards
    columns: 3
    tone: info
    cards:
      - title: Knowledge bank as human-authored guardrails first
        badge: 2026-09-24 sync
        body: >-
          Build the bank from lab-authored rules before any learned knowledge. The agent must
          cite the entry it acted on, and it must still be free to explore beyond the rules.
      - title: A principled, controlled experiment on the worst phase
        badge: 2026-09-24 sync
        body: >-
          Take XGBoost's failing phase, hold everything else fixed and make the fixed-vs-varied
          split explicit, so any gain can be attributed to one change.
      - title: Five rectification actions for a failing phase
        badge: 2026-09-27 Teams
        body: |-
          From A. Adiga's follow-up, with the instruction to "pick the phase where it fails most":
          - add examples from other seasons
          - oversample failing-phase windows
          - SMOTE
          - shorter window when the season diverges
          - loss weight lambda on approaching-peak rows
      - title: Summarize the best strategy from the logs
        badge: later
        body: >-
          Once experiments produce logs, run an agent over them to summarize which strategy
          worked best and why.

