  - id: reproduce
    heading: Reproduce
    kind: code
    intro: All commands run from the repo root with the project `.venv` active.
    code: |-
      # macOS: xgboost + torch each bundle libomp; avoid the duplicate-runtime segfault
      export KMP_DUPLICATE_LIB_OK=TRUE OMP_NUM_THREADS=1

      # knowledge bank
      python -m agent knowledge validate
      python -m agent knowledge query --phase peak --model xgboost_direct
      python -m agent knowledge import-experiment --log outputs/experiments/peak_rectification/log.jsonl
      python -m agent knowledge remove --id <id> --dry-run

      # demo (add --live to call the LLM)
      python scripts/demo_knowledge_bank.py
      python scripts/demo_knowledge_bank.py --live

      # experiment (add --summary-only to re-read the log without training)
      python scripts/experiments/peak_rectification.py
      python scripts/experiments/peak_rectification.py --summary-only

      # improve loop with the bank, then the run report
      python -m agent improve --cutoff-date 2025-12-06 --auto-apply
      python -m agent report <run_id>

      # this page
      python scripts/reports/build_report.py documentation/reports/2026-10-01
      python scripts/reports/build_report.py --index
