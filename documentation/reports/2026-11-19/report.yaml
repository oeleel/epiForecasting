  - id: decisions
    heading: Decisions requested
    kind: accordion
    items:
      - title: Should a loop result be stored per phase, with a held-out accept step?
        body: >-
          The held-out run says a config chosen at the peak hurts in decline. The proposal: keep
          accepted changes per phase, and confirm each one on a cutoff it was not selected on before
          it is kept.
      - title: Is the scaled comparison the next step?
        body: >-
          All 52 locations, all 9 pinned cutoffs, three seeds, held-out scoring as the primary
          result, with the paired significance test. Rivanna makes this feasible: 15 TSci runs took
          31 minutes on one GPU.
      - title: TSci with its full model list?
        body: >-
          This week tests one model inside TSci. Its design is to pick 3 of 21 and ensemble them,
          which is the fairer test of the framework.
      - title: Which paper is the hypothesis-generation paper?
        body: >-
          The repo already holds a summary of Ziatdinov et al., "Hypothesis learning in automated
          experiment" (package `hypoAL`). Confirm whether that is the paper meant, or name the other
          one and its Python package.
      - title: Is the reviewer reading of "agents with weights" the intended one?
        body: >-
          The restructure note reads it as parallel reviewers whose votes are weighted when a change
          is accepted or rejected.

