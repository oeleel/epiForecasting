  - id: comparison
    heading: TSci against our framework
    label: results
    kind: tabs
    intro: >-
      Five states (CA, FL, NY, TX, VA), three cutoffs, four weekly horizons: 60 rows. Metric: MAE of the
      point forecast in weekly admissions, because TSci returns point forecasts only. "Baseline" is each
      framework's own starting point: iteration 0 of our loop, and TSci's XGBoost at library defaults.
    tabs:
      - id: tuning-window
        label: Tuning window
        blocks:
          - kind: table
            columns:
              - Framework
              - { label: Baseline MAE, format: num }
              - { label: Final MAE, format: num }
              - { label: "Change, %", format: delta }
            rows:
              - ["Ours (`agent improve`, `xgboost_direct`)", 541.7, 473.5, -12.6]
              - ["TimeSeriesScientist (XGBoost only)", 644.4, 683.3, 6.0]
          - kind: table
            columns:
              - Cutoff
              - { label: Ours baseline, format: num }
              - { label: Ours final, format: num }
              - { label: "Ours, %", format: delta }
              - { label: TSci baseline, format: num }
              - { label: TSci final, format: num }
              - { label: "TSci, %", format: delta }
            rows:
              - ["2025-11-29 (growth)", 498.2, 367.3, -26.3, 741.9, 879.2, 18.5]
              - ["2025-12-27 (peak)", 490.2, 490.2, 0.0, 828.7, 673.6, -18.7]
              - ["2026-01-24 (peak)", 636.8, 563.1, -11.6, 362.5, 497.2, 37.2]
          - kind: table
            columns:
              - Horizon
              - { label: Ours baseline, format: num }
              - { label: Ours final, format: num }
              - { label: TSci baseline, format: num }
              - { label: TSci final, format: num }
            rows:
              - ["1 week", 389.7, 370.3, 195.2, 254.2]
              - ["2 weeks", 481.7, 475.5, 447.8, 478.9]
              - ["3 weeks", 610.9, 487.4, 851.8, 864.9]
              - ["4 weeks", 684.5, 560.8, 1082.7, 1135.4]
          - kind: callout
            tone: warning
            title: This table is in-sample for us
            body: >-
              Our loop keeps the iteration that scores best on these same four weeks, so our final
              cannot be worse than our baseline on WIS. TSci selects on a split inside the history.
              Note also that [[!TSci's plain XGBoost is the better 1-week forecaster]] on these states
              (195 against 390): a 10-lag recursive model tracks the last observation closely. Ours
              wins from 3 weeks ahead.
      - id: held-out
        label: Held-out
        blocks:
          - kind: markdown
            body: >-
              The configuration each framework chose at cutoff `c` forecasts from `c + 4 weeks`, next
              to that framework's untuned baseline from the same cutoff. No LLM call and no selection
              touches the scored weeks.
          - kind: table
            columns:
              - Framework
              - { label: Baseline MAE, format: num }
              - { label: Chosen-config MAE, format: num }
              - { label: "Change, %", format: delta }
              - Runs better / worse / equal
            rows:
              - ["Ours", 435.5, 465.4, 6.9, "4 / 6 / 5"]
              - ["TimeSeriesScientist", 497.2, 437.6, -12.0, "8 / 7 / 0"]
          - kind: table
            columns:
              - Chosen at, scored at
              - { label: Ours baseline, format: num }
              - { label: Ours chosen, format: num }
              - { label: "Ours, %", format: delta }
              - { label: TSci baseline, format: num }
              - { label: TSci chosen, format: num }
              - { label: "TSci, %", format: delta }
            rows:
              - ["2025-11-29, 2025-12-27", 490.2, 473.0, -3.5, 828.7, 830.8, 0.3]
              - ["2025-12-27, 2026-01-24", 636.8, 636.8, 0.0, 362.5, 361.8, -0.2]
              - ["2026-01-24, 2026-02-21", 179.6, 286.4, 59.5, 300.5, 120.2, -60.0]
          - kind: callout
            tone: destructive
            title: The in-sample gain does not transfer
            body: >-
              Two of three transfers are flat for both frameworks. The third decides everything. At
              2026-01-24 our loop's last accepted change was a peak-phase weight of 2.0; four weeks
              later the season is in decline, and [[-MAE over all 52 locations rises from 136.3 to
              167.0]]. The loop found a fix for the phase it was in, and that fix is wrong for the
              next phase. TSci's gain on the same transfer is not evidence of skill: its 15 runs
              chose 15 different settings and its record is 8 better against 7 worse.
          - kind: callout
            tone: info
            title: What this means for the design
            body: >-
              [[*A configuration chosen by the loop belongs to the phase it was chosen in.]] It
              should be stored and applied per phase, and an accepted change should be confirmed on
              a cutoff it was not selected on before it is kept. The reviewer step in the restructure
              note is the natural place for that check.
      - id: diagnosis
        label: Diagnosis (question B)
        blocks:
          - kind: table
            columns:
              - " "
              - Ours
              - TimeSeriesScientist
            rows:
              - ["Where the error is", "by epidemic phase, horizon and location, with signed bias: WIS 17 at 1 week against 303 at 4 weeks, worst states listed", "one pooled MSE / MAE / MAPE per series"]
              - ["Reading of the curve", "phases come from the knowledge bank; the peak is expected", "[[-the peak is a \"structural break\" and an \"outlier\"]]; 5 of 15 analyses say no seasonality is present, none says it is"]
              - ["Why a change was made", "rationale, expected effect, and the knowledge-bank entries it cites", "a free-text reason for the hyperparameter ranges"]
              - ["What the change did", "every iteration: action, WIS, change against the previous and the best; a regression is reverted", "not applicable: one tuning pass"]
              - ["Recommendation", "a config delta, for example `sample_weights.by_phase[growth] = 5.0`", "generic: \"apply normalization\", \"add lag features\", \"include ARIMA / LSTM\""]
              - ["Uncertainty", "five quantiles, coverage reported", "its own report notes that its intervals show no variability"]
          - kind: callout
            tone: success
            title: The claim that holds
            body: >-
              TSci is a straight line: preprocess, analyze, validate, forecast, report. A model is
              tuned once and nothing reacts to the forecast error. [[+Our loop names a failure, acts
              on it, and records why]]. This week shows the loop also needs to know when its fix
              stops applying.
      - id: limits
        label: Limits
        blocks:
          - kind: markdown
            body: |-
              - [[!One seed, 15 series, no significance test.]] The LLM is stochastic in both frameworks.
              - Different models under one name. Ours is one global model over all states with 59 features; TSci fits 10 lags of one state's series and forecasts recursively.
              - Different objectives. Our loop optimized WIS and is scored on MAE; TSci optimized MSE.
              - TSci's released code was changed to run at all (two call sites; upstream issue 4 reports the failure), and its `requirements.txt` does not resolve.
              - TSci was restricted to XGBoost. Its default is to pick 3 of 21 models and ensemble them.
              - TSci picks hyperparameters by a recursive forecast over the last 20% of the window (40 weeks here) for a 4-week task.
              - `qwen3:8b` for both. The TSci paper used GPT-4o-class models.

  - id: rivanna
    heading: Rivanna
    label: infrastructure
    kind: stack
    blocks:
      - kind: cards
        columns: 3
        cards:
          - title: Access
            badge: works
            tone: success
            body: >-
              Account `nssac_students`, partitions `bii` (CPU) and `bii-gpu` (V100 32 GB, one A100
              node). The "group not permitted" error from 2026-11-05 is gone.
          - title: LLM on a GPU node
            badge: works
            tone: success
            body: >-
              `scripts/slurm/llm.sbatch` starts Ollama with `qwen3:8b` on the job's own node, runs the
              command, and stops the server with the job. A TSci run takes about 2 minutes there,
              against about 8 on the laptop.
          - title: Two findings
            badge: caveat
            tone: warning
            body: >-
              The same config gives different XGBoost forecasts on Rivanna (x86-64) and the laptop
              (arm64): overall WIS 5.59 against 5.63, so one comparison stays on one machine. The
              installed torch has no kernels for the V100, so neural families train on CPU.
      - kind: markdown
        body: >-
          Not done: vLLM with the larger Qwen model. Ollama was used first to keep the model identical
          to the laptop's.

