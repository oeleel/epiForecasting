  - id: summary
    heading: Summary
    kind: stack
    blocks:
      - kind: callout
        title: This week in one paragraph
        body: >-
          The goal was a first comparison of our framework with TimeSeriesScientist on the flu data,
          XGBoost first. Both now run on Rivanna against the same `qwen3:8b` model, on the same pinned
          data, cutoffs and truth. Scored on the four weeks each framework tuned for, [[+our loop
          lowers MAE by 12.6%]] and [[-TSci's tuning raises it by 6.0%]]. That reading favours us,
          because our loop keeps the iteration that scores best on the scored weeks. A second run
          removes the advantage: each framework's chosen configuration forecasts from the next cutoff,
          four weeks later. There [[-our configurations are 6.9% worse than our own baseline]] and
          TSci's are 12.0% better than its own. One transfer out of three drives both numbers.
          [[*Neither framework shows a reliable out-of-sample gain on 15 series; the result that stands
          is the difference in what each framework can say about its model.]]
      - kind: stats
        stats:
          - value: "-12.6%"
            label: our MAE against our own baseline, on the tuning window (60 rows)
            tone: success
          - value: "+6.9%"
            label: our chosen configs against our baseline on the next cutoff (60 rows)
            tone: destructive
          - value: "6 of 15"
            label: TSci runs where its tuned XGBoost beat its own default XGBoost
            tone: warning
          - value: "15 of 15"
            label: TSci runs where the LLM recommended clipping outliers on an epidemic curve
            tone: warning

