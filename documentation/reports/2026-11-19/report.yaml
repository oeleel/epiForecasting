              - { label: Ours baseline, format: num }
              - { label: Ours final, format: num }
              - { label: TSci baseline, format: num }
              - { label: TSci final, format: num }
            rows:
              - ["1 week", 389.7, 370.3, 195.2, 254.2]
              - ["2 weeks", 481.7, 475.5, 447.8, 478.9]
              - ["3 weeks", 610.9, 487.4, 851.8, 864.9]
              - ["4 weeks", 684.5, 560.8, 1082.7, 1135.4]
          - kind: callout
            tone: warning
            title: This table is in-sample for us
            body: >-
              Our loop picks its best iteration on these same weeks. [[!TSci's plain XGBoost is better at
              1 week]] (195 vs 390); ours wins from 3 weeks.
      - id: held-out
        label: Held-out
        blocks:
          - kind: markdown
            body: >-
              The config chosen at cutoff `c` forecasts from `c + 4 weeks`. Nothing is selected on the scored weeks.
          - kind: table
            columns:
              - Framework
              - { label: Baseline MAE, format: num }
              - { label: Chosen-config MAE, format: num }
              - { label: "Change, %", format: delta }
              - Runs better / worse / equal
            rows:
              - ["Ours", 435.5, 465.4, 6.9, "4 / 6 / 5"]
              - ["TimeSeriesScientist", 497.2, 437.6, -12.0, "8 / 7 / 0"]
          - kind: table
            columns:
              - Chosen at, scored at
              - { label: Ours baseline, format: num }
              - { label: Ours chosen, format: num }
              - { label: "Ours, %", format: delta }
              - { label: TSci baseline, format: num }
              - { label: TSci chosen, format: num }
              - { label: "TSci, %", format: delta }
            rows:
              - ["2025-11-29, 2025-12-27", 490.2, 473.0, -3.5, 828.7, 830.8, 0.3]
              - ["2025-12-27, 2026-01-24", 636.8, 636.8, 0.0, 362.5, 361.8, -0.2]
              - ["2026-01-24, 2026-02-21", 179.6, 286.4, 59.5, 300.5, 120.2, -60.0]
          - kind: callout
            tone: destructive
            title: The in-sample gain does not transfer
            body: >-
              Two transfers are flat. The third decides it: a [[-peak-phase weight chosen at 2026-01-24
              hurts in decline]] (MAE 136.3 to 167.0 over 52 locations). TSci's gain is noise: 15 runs,
              15 different settings, 8 better vs 7 worse.
          - kind: callout
            tone: info
            title: What this means for the design
            body: >-
              [[*A config from the loop belongs to its phase.]] Store it per phase, and confirm it on
              a held-out cutoff before keeping it.
      - id: diagnosis
        label: Diagnosis (question B)
        blocks:
          - kind: table
            columns:
              - " "
              - Ours
              - TimeSeriesScientist
            rows:
              - ["Where the error is", "by phase, horizon, location, with signed bias", "one pooled MSE / MAE / MAPE"]
              - ["Reading of the curve", "phases from the knowledge bank", "[[-peak = \"structural break\", \"outlier\"]]"]
              - ["Why a change was made", "rationale, expected effect, cited entries", "free-text reason"]
              - ["What the change did", "per-iteration table; regressions reverted", "not applicable: one pass"]
              - ["Recommendation", "`sample_weights.by_phase[growth] = 5.0`", "\"apply normalization\", \"add lag features\""]
              - ["Uncertainty", "five quantiles, coverage", "intervals equal the point forecast"]
          - kind: callout
            tone: success
            title: The claim that holds
            body: >-
              TSci tunes once and nothing reacts to the error. [[+Our loop names a failure, acts, and
              records why.]] It also needs to know when its fix stops applying.
      - id: limits
        label: Limits
        blocks:
          - kind: markdown
            body: |-
              - [[!One seed, 15 series, no significance test.]]
              - Different models under one name: ours is global with 59 features; theirs is 10 lags of one series.
              - Different objectives: ours WIS, theirs MSE. Scored on MAE.
              - TSci's released code needed a two-line fix to run, and was restricted to XGBoost.
              - `qwen3:8b` for both; the TSci paper used GPT-4o-class models.

