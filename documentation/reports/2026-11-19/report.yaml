      - ["Comparison, tuning window", "ours [[+-12.6%]] MAE against own baseline, TSci [[-+6.0%]]", "gain"]
      - ["Comparison, held-out", "chosen config on the next cutoff: ours [[-+6.9%]], TSci [[+-12.0%]]", "problem"]
