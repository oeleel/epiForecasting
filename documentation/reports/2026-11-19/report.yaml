# Weekly meeting report, 2026-11-19. Rendered by scripts/reports/build_report.py.
# Section kinds and the markdown subset are documented in ../README.md.
title: "Weekly report - 2026-11-19"
date: "2026-11-19"
summary: >-
  First comparison with TimeSeriesScientist (TSci), XGBoost on the flu data, both frameworks on Rivanna
  with the same local LLM. On the window it tunes on, our loop improves its model and TSci does not. On
  the next cutoff the picture reverses, and neither framework shows a reliable gain on 15 series. What
  holds is the difference in diagnosis: phase, horizon and location against one pooled error.

sections:
  - id: quick
    heading: Quick summary
    label: 60 seconds
    kind: stack
    blocks:
      - kind: callout
        tone: success
        title: "Takeaway: our advantage over TimeSeriesScientist"
        body: |-
          [[*TSci decides once, before it has seen a forecast error. Ours forecasts, measures where the error is, and then acts, pass after pass.]] Three things follow from that, and TSci has none of them:

          - **It can notice a bad forecast and undo the change.** TSci tuned Virginia into a flat line of 103 while admissions rose to 843, and nothing in it could see that.
          - **It knows the disease.** Errors are read by epidemic phase, horizon and location, and each change cites the knowledge bank. TSci reads a flu peak as an "outlier" and a "structural break".
          - **It leaves an audit trail.** One named action per pass, with its reason and its measured effect, from a fixed catalog that a small local model can use safely.

          [[!Not shown yet: better accuracy on weeks the loop did not tune on.]] That is the open result.
      - kind: markdown
        body: |-
          - **Rivanna works.** The allocation runs jobs, and the LLM is served on a GPU node. Long runs no longer need the laptop. [Rivanna setup](#rivanna)
          - **First comparison with TimeSeriesScientist is done.** XGBoost, 5 states, 3 cutoffs, same LLM and data for both. [One run, step by step](#walkthrough)
          - **On the weeks it tunes for:** [[+our loop improves its model by 12.6%]], [[-TSci makes its model 6.0% worse]]. [Tuning-window tables](#panel-tuning-window)
          - **On the next cutoff:** [[-our gain does not carry over (6.9% worse)]]. A fix chosen at the peak hurts in decline. [Held-out tables](#panel-held-out)
          - [[*The result that holds: our framework says where and why the model fails; TSci gives one pooled error and calls the peak an outlier.]] [Diagnosis side by side](#panel-diagnosis)
          - **Their model list runs in our framework.** Four families added; the loop ran on all seven. [Per-family results](#model-list)
          - **Written:** related-work table, TSci differentiation, RepairAgent summary, restructure design note. [Related work](#related-work)
          - **Needs a decision:** per-phase configs with a held-out accept step, and the scaled comparison (52 locations, 9 cutoffs, 3 seeds). [Decisions requested](#decisions)

  - id: walkthrough
    heading: One run, step by step
    label: example
    kind: tabs
    intro: >-
      The same task for both frameworks: forecast weekly flu admissions for the 4 weeks after
      2025-11-29, with data from 2022-02-05 and the same `qwen3:8b` model. Everything below is copied
      from the two runs' own logs and reports (our run `20261119-174325-2b0e`; TSci run
      `51_2025-11-29`, Virginia). Nothing is paraphrased except for length.
    tabs:
      - id: side-by-side
        label: Side by side
        blocks:
          - kind: table
            columns:
              - Step
              - Ours
              - TimeSeriesScientist
            rows:
              - ["Input", "one model for all 52 locations, 59 features, 5 quantiles", "one state's series as 200 numbers, pasted into each prompt"]
              - ["1. Look at the data", "evaluate the baseline forecast by **phase, horizon, location**: WIS 17 at 1 week, 303 at 4 weeks, bias -158", "LLM reads the numbers: \"no clear seasonality\", \"structural break around the peak value (1315.0)\"; recommends clipping outliers"]
              - ["2. Say what is wrong", "Agent 1: \"systematic under-prediction, with extreme errors in growth phase forecasts\"; focus `peak_underprediction`", "no step: nothing has been forecast yet, so there is no error to diagnose"]
              - ["3. Decide a change", "Agent 2 picks **one action from a fixed catalog** and cites the knowledge bank: upweight the weeks before past peaks, cites `peak-is-hardest-to-forecast`", "LLM proposes a **hyperparameter grid**: `learning_rate` 0.01 / 0.1 / 0.2, `max_depth` 3 / 5 / 7, `n_estimators` 100 / 200 / 300"]
              - ["4. Try it", "retrain, re-score on the same 4 weeks: WIS 124.4 to 121.0, kept", "20 settings scored on a 40-week recursive forecast inside the history; best has MAE 599 and MAPE 3786%"]
              - ["5. React to the result", "[[+loop back to step 1 with the new forecast]]; 5 iterations, a regression is reverted", "[[-none: the pipeline moves on to the forecast]]"]
              - ["Output", "config change `by_phase[growth] = 5.0`, WIS 124.4 to 100.6, a table of every iteration and why", "4 point forecasts and a report that recommends \"differencing\" and \"hybrid models\""]
          - kind: callout
            tone: info
            title: The structural difference
            body: >-
              TSci decides everything before it has seen one forecast error, and never returns.
              [[*Our loop forecasts first, measures where the error is, and only then acts.]] That is
              why ours can say "week 4, growth phase, under-prediction" and TSci can only describe
              the shape of the input series.
      - id: our-loop
        label: Ours in detail
        blocks:
          - kind: table
            intro: >-
              Every pass through the five steps. Score: WIS over 52 locations (lower is better).
            columns:
              - Pass
              - What it said was wrong
              - Change made
              - Knowledge cited
              - { label: Score before, format: num }
              - { label: Score after, format: num }
              - { label: " ", format: badge, tones: { kept: success, reverted: destructive, "not checked": warning } }
            rows:
              - ["1", "`peak_underprediction`", "weight 2 on the 8 weeks before past peaks", "`peak-is-hardest-to-forecast`", 124.41, 120.96, "kept"]
              - ["2", "`horizon4_drift`", "growth-phase weight 3.0", "`phase-growth-adiga-2026-10`", 120.96, 106.54, "kept"]
              - ["3", "`growth_underprediction`", "growth-phase weight 4.0", "`phase-growth-adiga-2026-10`", 106.54, 101.88, "kept"]
              - ["4", "`growth_underprediction`", "growth-phase weight 5.0", "`train-short-window-on-takeoff`", 101.88, 100.55, "kept"]
              - ["5", "`week4_drift`", "training window 12 weeks", "`train-short-window-on-takeoff`", 100.55, 224.11, "reverted"]
          - kind: accordion
            items:
              - title: "1. Look at the data"
                body: |-
                  **Who:** code (the phase-aware evaluator). No LLM.

                  **Input:** the baseline forecast for 52 locations (208 rows) and the observed admissions.

                  **Output:** WIS 124.41, bias -157.5, 90% coverage 0.81. By horizon: WIS 17.4 / 44.8 / 132.1 / 303.4 and bias -19.9 / -50.2 / -171.5 / -388.3 for weeks 1 to 4. Phase: growth.

                  **Result:** a table of errors by phase, horizon and location, handed to step 2.
              - title: "2. Say what is wrong"
                body: |-
                  **Who:** Agent 1 (LLM).

                  **Input:** the error table from step 1.

                  **Output:** "The model performs well overall (MAPE 38.7%) but shows significant degradation in longer horizons and peak phase predictions. Negative bias indicates systematic under-prediction, with extreme errors in growth phase forecasts during December 2025." Focus: `peak_underprediction`.

                  **Result:** checked against a fixed schema, then handed to step 3.
              - title: "3. Decide a change"
                body: |-
                  **Who:** Agent 2 (LLM).

                  **Input:** the diagnosis, a catalog of 7 allowed actions, and the knowledge-bank entries retrieved for the weak phase.

                  **Output:** `reweight_training_samples(dimension=approaching_peak, value=8, weight=2)`. Rationale: "The model under-predicts peak phases due to insufficient training on rapid growth dynamics, which is addressed by upweighting the weeks leading into past peaks." Cites `peak-is-hardest-to-forecast`, `train-short-window-on-takeoff`, `window-length-is-a-search-dimension`.

                  **Result:** validated against the catalog and the parameter bounds, then applied to the config.
              - title: "4. Try it"
                body: |-
                  **Who:** code (the training pipeline and the evaluator). No LLM.

                  **Input:** the changed config.

                  **Output:** the model is retrained and forecasts the same 4 weeks. WIS 120.96 (was 124.41), bias -150.4.

                  **Result:** [[+kept as the new best]].
              - title: "5. React to the result"
                body: |-
                  **Who:** the loop.

                  **Input:** the score from step 4.

                  **Output:** [[+back to step 1 with the new forecast.]] Four more passes follow (table above).

                  **Result:** pass 5 raised WIS from 100.55 to 224.11 and was [[-reverted]]. The run ends after 5 passes with the config of pass 4.
              - title: What it hands back
                body: |-
                  - **Recommendation:** "adopt iteration 4's config (`sample_weights.by_phase[growth] = 5.0`), wis improved 19.2%"
                  - **Where the error is:** by horizon, WIS 14.5 / 40.0 / 97.0 / 250.7; worst locations with signed bias: Rhode Island (-77.7), Oregon (+43.3), Arkansas (+69.4), Arizona (+71.9), Nevada (-77.9)
                  - **Uncertainty:** five quantiles per forecast; the 90% interval covers 83% of outcomes
                  - **Full output:** `documentation/experiments/tsci_comparison/our-run-20261119-174325-2b0e.md`
      - id: tsci-pipeline
        label: TSci in detail
        blocks:
          - kind: table
            intro: >-
              Every pass through the five steps. Score: MAE on the 4 forecast weeks for Virginia (lower
              is better); "before" is its XGBoost at library defaults.
            columns:
              - Pass
              - What it said was wrong
              - Change made
              - Knowledge cited
              - { label: Score before, format: num }
              - { label: Score after, format: num }
              - { label: " ", format: badge, tones: { kept: success, reverted: destructive, "not checked": warning } }
            rows:
              - ["1", "nothing: no forecast exists when it decides", "`learning_rate=0.01`, `max_depth=3`, `n_estimators=100`", "none", 164.3, 290.3, "not checked"]
          - kind: accordion
            items:
              - title: "1. Look at the data"
                body: |-
                  **Who:** Curator and Planner (LLM), three calls.

                  **Input:** Virginia's 200 weekly values, pasted into the prompt as a list of numbers.

                  **Output:** "no clear seasonality", "non-stationary", "spikes, dips, irregular fluctuations". "The trend is non-linear with a pronounced structural break around the peak value (1315.0)." Challenges: "Structural breaks (e.g., the sharp decline after the peak at 1315.0)", "Outliers (e.g., the sudden drop to 10.0 after 1315.0)". Preprocessing decision: clip outliers.

                  **Result:** the outlier detector found none, so nothing was clipped. The plot step failed (the LLM's plot plan was not valid JSON) and the run continued. [[!The series is four flu seasons and 1315 is the 2022-23 peak]]; nothing tells the LLM that.
              - title: "2. Say what is wrong"
                body: |-
                  **Who:** no one.

                  **Input:** none. No forecast has been made yet, so there is no error to look at.

                  **Output:** none.

                  **Result:** [[-this step does not exist in TSci.]]
              - title: "3. Decide a change"
                body: |-
                  **Who:** Planner (LLM).

                  **Input:** its own analysis text from step 1 and the list of available models (XGBoost only in this run).

                  **Output:** a search grid: `learning_rate` [0.01, 0.1, 0.2], `max_depth` [3, 5, 7], `n_estimators` [100, 200, 300]. Reason: "XGBoost is well-suited for non-stationary data with structural breaks and heteroscedasticity. The learning_rate controls convergence speed for fluctuating values, max_depth balances complexity for non-linear trends [...]". Cites nothing.

                  **Result:** parsed as JSON; 20 settings from the grid go to step 4. No bounds or catalog are checked.
              - title: "4. Try it"
                body: |-
                  **Who:** code (the Forecaster's validation). No LLM.

                  **Input:** the 20 settings.

                  **Output:** each setting is fitted on the first 80% of the series and forecasts the last 20% (40 weeks) recursively. Best: `learning_rate=0.01, max_depth=3, n_estimators=100`, with validation MAE 599.1 and MAPE 3786%.

                  **Result:** that setting forecasts the 4 target weeks: 91, 103, 103, 103 (truth: 167, 195, 357, 843). MAE 290.3, against 164.3 for the default settings. [[-Not compared with the default; used as is.]]
              - title: "5. React to the result"
                body: |-
                  **Who:** no one.

                  **Input:** the test error is computed and written to the report.

                  **Output:** [[-none. There is no path back to an earlier step.]]

                  **Result:** the run ends after 1 pass.
              - title: What it hands back
                body: |-
                  - **Recommendation:** "Prioritize differencing, segmentation around structural breaks, and hybrid models to improve reliability."
                  - **Where the error is:** one set of pooled numbers for the series: MSE 156,415.7, MAE 290.26, MAPE 62.83%
                  - **Uncertainty:** 80%, 90% and 95% bounds all equal the point forecast (the intervals are the spread across selected models, and there is one model)
                  - **Full output:** `results.json` and `run.log` under `tsci_comparison/runs/51_2025-11-29/` on Rivanna scratch
      - id: virginia
        label: Virginia, the 4 forecasts
        blocks:
          - kind: table
            intro: >-
              Weekly admissions in Virginia after the 2025-11-29 cutoff. Our numbers are the median, with
              the 90% interval of the final forecast in the last column.
            columns:
              - Target week
              - { label: Actual, format: num }
              - { label: Ours baseline, format: num }
              - { label: Ours final, format: num }
              - { label: TSci default, format: num }
              - { label: TSci tuned, format: num }
              - Ours final, 90% interval
            rows:
              - ["2025-12-06", 167, 149, 145, 99, 91, "98 to 237"]
              - ["2025-12-13", 195, 194, 215, 167, 103, "127 to 407"]
              - ["2025-12-20", 357, 287, 375, 292, 103, "156 to 715"]
              - ["2025-12-27", 843, 500, 622, 347, 103, "206 to 833"]
          - kind: callout
            tone: warning
            body: >-
              One state and one cutoff, chosen because both runs are easy to read; it is an
              illustration, not the result. [[!This is the in-sample window for our loop]], and across
              all 60 scored rows the held-out picture is different (see the Held-out tab below).
              What the example does show is the mechanism: TSci's tuning produced a flat line of 103
              during a growth phase, and nothing in TSci could notice.

