      - title: vLLM and a larger model
        badge: "5"
        body: The A100 node or several V100s; the torch build needs a fix for V100 first.

  - id: reproduce
    heading: Reproduce
    kind: code
    code: |-
      # On Rivanna, from ~/epiForecasting (setup: documentation/QUICKSTART.md, "Running on Rivanna")
      scripts/comparison/setup_tsci.sh ~/TimeSeriesScientist
      S=/scratch/$USER/epiForecasting/tsci_comparison
      .venv/bin/python scripts/comparison/prepare_flu_series.py --locations 51 06 48 36 12 \
          --cutoffs 2025-11-29 2025-12-27 2026-01-24 --out $S/series

      # TSci, XGBoost only (job 23162203, 31 minutes)
      sbatch -J tsci scripts/slurm/llm.sbatch .venv/bin/python scripts/comparison/run_tsci_batch.py \
          --tsci-root ~/TimeSeriesScientist --series $S/series --out $S/runs --models XGBoost --llm-model qwen3:8b

      # Ours, one improve run per cutoff (job 23162245, 12 minutes)
      sbatch -J ours scripts/slurm/llm.sbatch .venv/bin/python -u -m agent improve \
          --cutoff-date 2025-11-29 --model-family xgboost_direct --auto-apply --exclude-locations US

      # Score, then the held-out re-score (job 23167461)
      .venv/bin/python scripts/comparison/score_comparison.py --tsci-runs $S/runs --series $S/series \
          --our-runs outputs/agent_runs/<run_id> ... --out $S/summary.md
      .venv/bin/python scripts/comparison/heldout_rescore.py ours --runs-dir outputs/agent_runs --run-ids <run_id> ... --out $S/heldout
